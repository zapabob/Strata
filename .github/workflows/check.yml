name: Checks

# The fast checks (tools/check), one job per step so a failure names its step: the CPU CMake preset, the Python suites, the host's
# typecheck / test / build.  No GPU, no model and no download of weights.  The config snapshot has its own workflow (snapshot.yml)
# and the backend compile checks theirs (backends.yml).  Run the same thing by hand:  python tools/check --only <step>

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/check.yml
      - tools/check
      - requirements*.txt
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - include/**
      - bench/micro/**
      - third_party/**
      - tests/**
      - serve/**
      - strata.py
      - setup.py
      - strata_cli/**
      - strata_control/**
      - tools/**
      - packaging/**
      - docker/**
      - apps/host/**
      - apps/desktop/**
      - metal/**
      - sycl/**
  pull_request:
    paths:
      - .github/workflows/check.yml
      - tools/check
      - requirements*.txt
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - src/**
      - include/**
      - bench/micro/**
      - third_party/**
      - tests/**
      - serve/**
      - strata.py
      - setup.py
      - strata_cli/**
      - strata_control/**
      - tools/**
      - packaging/**
      - docker/**
      - apps/host/**
      - apps/desktop/**
      - metal/**
      - sycl/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: Windows / pinned Harness context and guard integration
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - name: Host packages
        working-directory: apps/host
        run: npm ci --no-audit --no-fund
      - name: Extract the immutable qualified Harness component
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'Strata-0.5.7-windows-x64-setup.exe'
          Invoke-WebRequest 'https://github.com/zapabob/Strata/releases/download/v0.5.7/Strata-0.5.7-windows-x64-setup.exe' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant() -ne '2f2b14b22c7a1e5433820e05e5b0eca3ddb02ec09d031e8264d8b1be734233c2') { throw 'Pinned installer digest mismatch' }
          $staged = Join-Path $env:RUNNER_TEMP 'strata-harness'
          & 'C:\Program Files\7-Zip\7z.exe' x $installer 'harness/*' "-o$staged" -y
          if ($LASTEXITCODE -ne 0) { throw 'Harness extraction failed' }
          $harness = Join-Path $staged 'harness'
          $record = Get-Content -LiteralPath (Join-Path $harness 'BUNDLE.json') -Raw | ConvertFrom-Json
          if ($record.commit -ne '571902028a75c64c1d767f4ae5fd099485f0ddf0') { throw 'Harness source identity mismatch' }
          "STRATA_HARNESS_DIR=$harness" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'STRATA_NO_ACQUIRE=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Real Harness regressions (no model weights or service keys)
        working-directory: apps/host
        run: node --test --test-concurrency=2 tests/agent-context.test.mjs tests/agent-tools.test.mjs tests/agent-turn-guard.test.mjs tests/harness-environment.test.mjs tests/workflow-safety-harness.test.mjs

  linux:
    name: Linux / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu CMake preset, only: cmake-cpu }
          - { name: Python tests/, only: py-tests }
          - { name: Python serve/, only: py-serve }
          - { name: Python tools/, only: py-tools }
          - { name: host typecheck + test + build, only: "host-typecheck,host-test,host-build" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
      - name: tools/check
        run: python tools/check --strict --only "${{ matrix.only }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-linux-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7

  windows:
    name: Windows / ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: cpu CMake preset (MSVC), only: cmake-cpu }
          - { name: Python tests/, only: py-tests }
          - { name: Python serve/, only: py-serve }
          - { name: Python tools/, only: py-tools }
          - { name: host typecheck + test + build, only: "host-typecheck,host-test,host-build" }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-build.txt
      # tools/check finds Visual Studio's compiler itself (vcvars64.bat); bash is Git for Windows' (the tester-README tests need it)
      - name: Dedicated H drive for Windows process-guard fixtures
        if: ${{ matrix.only == 'py-tools' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path 'H:\') { throw 'H drive is already assigned; refusing to reuse unrelated storage' }
          $guardVolume = Join-Path $env:RUNNER_TEMP 'strata-guard-volume'
          New-Item -ItemType Directory -Path $guardVolume | Out-Null
          subst H: $guardVolume
          if ($LASTEXITCODE -ne 0) { throw 'Cannot create the isolated fixture volume' }
          New-Item -ItemType Directory -Path 'H:\Strata\build' -Force | Out-Null
      - name: tools/check
        shell: pwsh
        run: |
          $checkRoot = "$env:RUNNER_TEMP\check"
          python tools/check --strict --only "${{ matrix.only }}" --keep --scratch $checkRoot --json "$checkRoot\result.json"
      - name: Logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-windows-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}\check\*.log
            ${{ runner.temp }}\check\result.json
          retention-days: 7

  macos:
    # Keep both Mac suites required. Repeated hosted ARM64 allocation expired
    # before any step; use the standard Intel pool. Metal still compiles on ARM64.
    name: macOS / ${{ matrix.name }}
    runs-on: macos-26-intel
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - { name: host typecheck + test + build, only: "host-typecheck,host-test,host-build" }
          - { name: Python tools/, only: py-tools }
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/host/package-lock.json
      - name: Python packages
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: tools/check
        run: python tools/check --strict --only "${{ matrix.only }}" --keep --scratch "$RUNNER_TEMP/check" --json "$RUNNER_TEMP/check/result.json"
      - name: Logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: check-macos-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/check/*.log
            ${{ runner.temp }}/check/result.json
          retention-days: 7
