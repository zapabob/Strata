name: Native preview CPU checks

on:
  push:
    paths:
      - 'spin8/**'
      - 'tqcodec/**'
      - 'src/core/spin8*'
      - 'src/core/native_cache*'
      - 'src/core/layer.cpp'
      - 'tests/core/**'
      - 'src/program/generate.cpp'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'data/spin8/**'
      - 'packaging/native_preview.py'
      - 'packaging/binary_deps.py'
      - 'tests/terminal/test_native_preview.py'
      - 'docs/research/triality-poc/**'
      - 'tools/*spin8*'
      - '.github/workflows/native-preview.yml'
  pull_request:
    paths:
      - 'spin8/**'
      - 'tqcodec/**'
      - 'src/core/spin8*'
      - 'src/core/native_cache*'
      - 'src/core/layer.cpp'
      - 'tests/core/**'
      - 'src/program/generate.cpp'
      - 'include/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - 'data/spin8/**'
      - 'packaging/native_preview.py'
      - 'packaging/binary_deps.py'
      - 'tests/terminal/test_native_preview.py'
      - 'docs/research/triality-poc/**'
      - 'tools/*spin8*'
      - '.github/workflows/native-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: CPU contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Packaging boundary tests (no runtime downloads)
        run: python -B -m unittest discover -s tests/terminal -p test_native_preview.py
      - name: PoC numerical aggregation reproduction
        run: python -B docs/research/triality-poc/reproduce.py
      - name: Prepare Linux glibc math compatibility header
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cat << 'EOF' > "${RUNNER_TEMP}/glibc_math_compat.h"
          #ifdef __cplusplus
          #define gamma __glibc_obsolete_gamma
          #include <cmath>
          #undef gamma
          #endif
          EOF
      - name: Configure CPU Spin8
        shell: bash
        run: |
          EXTRA_FLAGS=()
          if [ "${RUNNER_OS}" = "Linux" ]; then
            EXTRA_FLAGS+=("-DCMAKE_CXX_FLAGS=-include ${RUNNER_TEMP}/glibc_math_compat.h")
          fi
          cmake -S spin8 -B build-preview-spin8 -DSPIN8_ENABLE_CUDA=OFF -DSPIN8_BUILD_TESTS=ON "${EXTRA_FLAGS[@]}"
      - name: Build CPU Spin8
        run: cmake --build build-preview-spin8 --config Release --parallel 2
      - name: Test CPU Spin8
        run: ctest --test-dir build-preview-spin8 -C Release --output-on-failure --no-tests=error
      - name: Configure CPU codecs
        shell: bash
        run: |
          EXTRA_FLAGS=()
          if [ "${RUNNER_OS}" = "Linux" ]; then
            EXTRA_FLAGS+=("-DCMAKE_CXX_FLAGS=-include ${RUNNER_TEMP}/glibc_math_compat.h")
          fi
          cmake -S tqcodec -B build-preview-tqcodec -DBUILD_TESTING=ON -DTQCODEC_DIALECTS=ON -DTQCODEC_DIALECTS_CUDA=OFF -DTQCODEC_SPIN8_TESTS=ON "${EXTRA_FLAGS[@]}"
      - name: Build CPU codecs
        run: cmake --build build-preview-tqcodec --config Release --parallel 2
      - name: Test CPU codecs
        run: ctest --test-dir build-preview-tqcodec -C Release --output-on-failure --no-tests=error
